<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <title>Системное мышление</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Инструменты для целенаправленного поведения и моделирования процессов">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <style>
    /* D2 диаграммы */
    .d2-diagram {
      text-align: center;
      margin: 0.5em 0;
    }
    .d2-diagram img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    /* Mermaid диаграммы */
    .mermaid {
      text-align: left;
      margin: 0.5em 0;
    }
    .mermaid svg {
      max-width: 100%;
      height: auto;
    }
    /* Компактные отступы */
    .markdown-section p {
      margin: 0.8em 0;
    }
    .markdown-section hr {
      margin: 1em 0;
    }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>

  <!-- Pako - ПЕРЕД конфигурацией docsify -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

  <!-- Mermaid - ПЕРЕД конфигурацией docsify -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
  </script>

  <!-- Docsify config -->
  <script>
    window.$docsify = {
      name: 'Системное мышление',
      routerMode: 'history',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,

      alias: {
        '/.*/(_sidebar).md': '/_sidebar.md'
      },

      search: {
        placeholder: 'Поиск',
        noData: 'Ничего не найдено',
        depth: 3
      },

      // D2 диаграммы через Kroki, Mermaid диаграммы
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'd2') {
              try {
                const data = new TextEncoder().encode(code);
                const compressed = pako.deflate(data, { level: 9 });
                const encoded = btoa(String.fromCharCode.apply(null, compressed))
                  .replace(/\+/g, '-')
                  .replace(/\//g, '_');
                return '<div class="d2-diagram"><img src="https://kroki.io/d2/svg/' + encoded + '" alt="D2 diagram"></div>';
              } catch (e) {
                console.error('D2 encoding error:', e);
                return '<pre><code>' + code + '</code></pre>';
              }
            }
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },

      plugins: [
        function(hook) {
          hook.doneEach(function() {
            if (typeof mermaid !== 'undefined') {
              mermaid.run({ querySelector: '.mermaid' });
            }
          });
        }
      ]
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>

  <!-- KaTeX -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.4/dist/docsify-katex.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
