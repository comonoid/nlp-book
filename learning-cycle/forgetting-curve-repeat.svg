<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif;font-size:11px">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <clipPath id="clip1"><rect x="460" y="0" width="45" height="300"/></clipPath>
    <clipPath id="clip2"><rect x="505" y="0" width="45" height="300"/></clipPath>
    <clipPath id="clip3"><rect x="550" y="0" width="45" height="300"/></clipPath>
    <clipPath id="clip4"><rect x="595" y="0" width="45" height="300"/></clipPath>
    <clipPath id="clip5"><rect x="640" y="0" width="45" height="300"/></clipPath>
  </defs>

  <!-- ЛЕВЫЙ ГРАФИК: Без повторения -->
  <text x="175" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#333">Без повторения</text>

  <!-- Оси левого графика -->
  <line x1="70" y1="270" x2="340" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="70" y1="270" x2="70" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Подписи осей -->
  <text x="65" y="58" font-size="10" fill="#555" text-anchor="end">100%</text>
  <text x="65" y="120" font-size="10" fill="#555" text-anchor="end">75%</text>
  <text x="65" y="178" font-size="10" fill="#555" text-anchor="end">50%</text>
  <text x="65" y="235" font-size="10" fill="#555" text-anchor="end">25%</text>
  <text x="205" y="300" font-size="11" fill="#333" text-anchor="middle">Время (дни)</text>
  <text x="25" y="160" font-size="11" fill="#333" writing-mode="tb" text-anchor="middle">Сохранение</text>

  <!-- Деления на оси X -->
  <line x1="115" y1="265" x2="115" y2="275" stroke="#333" stroke-width="1"/>
  <text x="115" y="287" font-size="9" text-anchor="middle">1</text>
  <line x1="160" y1="265" x2="160" y2="275" stroke="#333" stroke-width="1"/>
  <text x="160" y="287" font-size="9" text-anchor="middle">2</text>
  <line x1="205" y1="265" x2="205" y2="275" stroke="#333" stroke-width="1"/>
  <text x="205" y="287" font-size="9" text-anchor="middle">3</text>
  <line x1="250" y1="265" x2="250" y2="275" stroke="#333" stroke-width="1"/>
  <text x="250" y="287" font-size="9" text-anchor="middle">4</text>
  <line x1="295" y1="265" x2="295" y2="275" stroke="#333" stroke-width="1"/>
  <text x="295" y="287" font-size="9" text-anchor="middle">5</text>

  <!-- Горизонтальные линии сетки -->
  <line x1="70" y1="55" x2="320" y2="55" stroke="#eee" stroke-width="1"/>
  <line x1="70" y1="116" x2="320" y2="116" stroke="#eee" stroke-width="1"/>
  <line x1="70" y1="177" x2="320" y2="177" stroke="#eee" stroke-width="1"/>
  <line x1="70" y1="232" x2="320" y2="232" stroke="#eee" stroke-width="1"/>

  <!-- Кривая забывания без повторения — адаптировано из оригинала Wikimedia -->
  <!-- Оригинал: M 154,404 C 160,508 243,571 405,581 -->
  <path d="M 70,55 C 76,170 157,242 320,254" fill="none" stroke="#2980b9" stroke-width="2.5"/>

  <!-- Точка начала -->
  <circle cx="70" cy="55" r="4" fill="#2980b9"/>


  <!-- ПРАВЫЙ ГРАФИК: С повторением -->
  <text x="590" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="#333">С повторением</text>

  <!-- Оси правого графика -->
  <line x1="460" y1="270" x2="760" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="270" x2="460" y2="40" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Подписи осей -->
  <text x="455" y="58" font-size="10" fill="#555" text-anchor="end">100%</text>
  <text x="455" y="120" font-size="10" fill="#555" text-anchor="end">75%</text>
  <text x="455" y="178" font-size="10" fill="#555" text-anchor="end">50%</text>
  <text x="455" y="235" font-size="10" fill="#555" text-anchor="end">25%</text>
  <text x="610" y="300" font-size="11" fill="#333" text-anchor="middle">Время (дни)</text>

  <!-- Деления на оси X -->
  <line x1="505" y1="265" x2="505" y2="275" stroke="#333" stroke-width="1"/>
  <text x="505" y="287" font-size="9" text-anchor="middle">1</text>
  <line x1="550" y1="265" x2="550" y2="275" stroke="#333" stroke-width="1"/>
  <text x="550" y="287" font-size="9" text-anchor="middle">2</text>
  <line x1="595" y1="265" x2="595" y2="275" stroke="#333" stroke-width="1"/>
  <text x="595" y="287" font-size="9" text-anchor="middle">4</text>
  <line x1="640" y1="265" x2="640" y2="275" stroke="#333" stroke-width="1"/>
  <text x="640" y="287" font-size="9" text-anchor="middle">7</text>
  <line x1="685" y1="265" x2="685" y2="275" stroke="#333" stroke-width="1"/>
  <text x="685" y="287" font-size="9" text-anchor="middle">14</text>
  <line x1="730" y1="265" x2="730" y2="275" stroke="#333" stroke-width="1"/>
  <text x="730" y="287" font-size="9" text-anchor="middle">30</text>

  <!-- Горизонтальные линии сетки -->
  <line x1="460" y1="55" x2="740" y2="55" stroke="#eee" stroke-width="1"/>
  <line x1="460" y1="116" x2="740" y2="116" stroke="#eee" stroke-width="1"/>
  <line x1="460" y1="177" x2="740" y2="177" stroke="#eee" stroke-width="1"/>
  <line x1="460" y1="232" x2="740" y2="232" stroke="#eee" stroke-width="1"/>

  <!-- Полные кривые (бледные) — от начала до конца графика -->
  <path d="M 460,55 C 466,170 547,242 740,254" fill="none" stroke="#2980b9" stroke-width="1.5" opacity="0.25"/>
  <path d="M 505,55 C 520,145 600,210 740,230" fill="none" stroke="#27ae60" stroke-width="1.5" opacity="0.25"/>
  <path d="M 550,55 C 570,125 640,175 740,195" fill="none" stroke="#e67e22" stroke-width="1.5" opacity="0.25"/>
  <path d="M 595,55 C 615,105 680,145 740,162" fill="none" stroke="#9b59b6" stroke-width="1.5" opacity="0.25"/>
  <path d="M 640,55 C 660,90 710,118 740,130" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.25"/>

  <!-- Яркие части кривых — поверх бледных, до точки следующего повторения -->
  <!-- Яркие кривые (обрезанные clipPath) -->
  <path d="M 460,55 C 466,170 547,242 740,254" fill="none" stroke="#2980b9" stroke-width="2" clip-path="url(#clip1)"/>
  <path d="M 505,55 C 520,145 600,210 740,230" fill="none" stroke="#27ae60" stroke-width="2" clip-path="url(#clip2)"/>
  <path d="M 550,55 C 570,125 640,175 740,195" fill="none" stroke="#e67e22" stroke-width="2" clip-path="url(#clip3)"/>
  <path d="M 595,55 C 615,105 680,145 740,162" fill="none" stroke="#9b59b6" stroke-width="2" clip-path="url(#clip4)"/>
  <path d="M 640,55 C 660,90 710,118 740,130" fill="none" stroke="#e74c3c" stroke-width="2" clip-path="url(#clip5)"/>

  <!-- Последняя кривая без обрезки -->
  <path d="M 685,55 C 700,75 725,90 740,98" fill="none" stroke="#1abc9c" stroke-width="2"/>

  <!-- Точки повторений -->
  <circle cx="460" cy="55" r="3" fill="#2980b9"/>
  <circle cx="505" cy="55" r="3" fill="#27ae60"/>
  <circle cx="550" cy="55" r="3" fill="#e67e22"/>
  <circle cx="595" cy="55" r="3" fill="#9b59b6"/>
  <circle cx="640" cy="55" r="3" fill="#e74c3c"/>
  <circle cx="685" cy="55" r="3" fill="#1abc9c"/>

  <!-- Вертикальные пунктирные линии повторений — от точки на кривой вверх -->
  <line x1="505" y1="60" x2="505" y2="168" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="550" y1="60" x2="550" y2="145" stroke="#e67e22" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="595" y1="60" x2="595" y2="129" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="640" y1="60" x2="640" y2="112" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="685" y1="60" x2="685" y2="101" stroke="#1abc9c" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Легенда -->
  <text x="610" y="325" font-size="10" fill="#555" text-anchor="middle">Вертикальные линии — моменты повторения</text>
</svg>
