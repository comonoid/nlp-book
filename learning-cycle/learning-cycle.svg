<svg viewBox="0 0 520 310" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker>
  </defs>

  <!-- Блоки -->
  <rect x="10" y="10" width="180" height="100" rx="8" fill="#fce4ec" stroke="#c48b9f" stroke-width="1"/>
  <rect x="330" y="10" width="180" height="100" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <rect x="10" y="200" width="180" height="100" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <rect x="330" y="200" width="180" height="100" rx="8" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>

  <!-- Текст -->
  <text x="100" y="45" text-anchor="middle" font-weight="bold" font-size="12">4. Бессознательная</text>
  <text x="100" y="62" text-anchor="middle" font-weight="bold" font-size="12">компетентность</text>
  <text x="100" y="85" text-anchor="middle" font-size="11" fill="#555">Не знаю, что знаю</text>

  <text x="420" y="45" text-anchor="middle" font-weight="bold" font-size="12">3. Сознательная</text>
  <text x="420" y="62" text-anchor="middle" font-weight="bold" font-size="12">компетентность</text>
  <text x="420" y="85" text-anchor="middle" font-size="11" fill="#555">Знаю, что знаю</text>

  <text x="100" y="235" text-anchor="middle" font-weight="bold" font-size="12">1. Бессознательная</text>
  <text x="100" y="252" text-anchor="middle" font-weight="bold" font-size="12">некомпетентность</text>
  <text x="100" y="275" text-anchor="middle" font-size="11" fill="#555">Не знаю, что не знаю</text>

  <text x="420" y="235" text-anchor="middle" font-weight="bold" font-size="12">2. Сознательная</text>
  <text x="420" y="252" text-anchor="middle" font-weight="bold" font-size="12">некомпетентность</text>
  <text x="420" y="275" text-anchor="middle" font-size="11" fill="#555">Знаю, что не знаю</text>

  <!-- Стрелки -->
  <!-- 1 → 2 -->
  <line x1="190" y1="250" x2="325" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2 → 3 -->
  <line x1="420" y1="200" x2="420" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 3 → 4 -->
  <line x1="330" y1="45" x2="195" y2="45" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 4 → 3 (дообучение, пунктир) -->
  <line x1="195" y1="75" x2="325" y2="75" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="260" y="95" text-anchor="middle" font-size="10" fill="#888">дообучение</text>
</svg>
